name: rrgym-ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  node-court:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run check
      - name: no ambient actuator imports
        run: |
          ! grep -RInE 'child_process|net\.|http\.|https\.|fetch\(|process\.env|exec\(|spawn\(' src
