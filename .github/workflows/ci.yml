name: rrgym-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node-court:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact subject identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - name: Execute constitutional court
        run: npm test
      - name: Syntax and duplicate court
        run: npm run check
      - name: Execute bounded doctor
        run: npm run doctor
      - name: Refuse ambient actuator imports
        shell: bash
        run: |
          ! grep -RInE 'child_process|net\.|http\.|https\.|fetch\(|process\.env|exec\(|spawn\(' src
